name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Memória do projeto (link, âncora, procedência, validade)
        run: python lint.py

      - name: Validador estático das fases
        run: node tools/validate-levels.mjs

      - name: Bump do cache do SW (regressão AUD-02)
        run: node tools/check-sw-cache.mjs

      - name: Smoke test (storage normal)
        run: node tests/smoke.mjs

      - name: Smoke test (storage bloqueado — regressão AUD-03)
        run: SMOKE_THROW_STORAGE=1 node tests/smoke.mjs
