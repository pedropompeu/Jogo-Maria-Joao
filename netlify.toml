# F0 (AUD-06): config de deploy versionada — publish relativo (nunca path local)
# e headers PWA: sw.js sem cache (evita stale eterno) + manifest tipado.
[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# AUD-11: só o index.html de maio (SW unicorn-v7) pede game.js?v=… pela rede —
# o atual pede game.js sem query. Regra com query casa só URLs com exatamente
# esse parâmetro; force porque /game.js existe.
[[redirects]]
  from = "/game.js"
  to = "/legacy/v7-reload.js"
  status = 200
  force = true
  query = {v = ":v"}
