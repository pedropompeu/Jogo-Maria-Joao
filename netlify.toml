# F0 (AUD-06): config de deploy versionada — publish relativo (nunca path local)
# e headers PWA: sw.js sem cache (evita stale eterno) + manifest tipado.
[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
